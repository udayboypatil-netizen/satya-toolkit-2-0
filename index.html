
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satya Toolkit 2.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:flex;align-items:center;justify-content:center;
 background:#090711;color:white;font-family:Arial,sans-serif
}
.container{
 width:100%;max-width:430px;padding:28px 22px;
 background:#171225;border:1px solid #49336b;
 border-radius:22px;box-shadow:0 15px 50px #0008
}
.logo{
 width:65px;height:65px;margin:auto;border-radius:18px;
 display:grid;place-items:center;font-size:27px;font-weight:bold;
 background:linear-gradient(135deg,#9b45ff,#5420a8)
}
h1{text-align:center;font-size:25px;margin:17px 0 7px}
.sub{text-align:center;color:#b9a9d2;font-size:13px}
.line{height:1px;background:#403052;margin:23px 0}
label{display:block;margin:15px 0 8px;font-size:14px;color:#d9c9f2}
input{
 width:100%;padding:15px;border-radius:11px;
 background:#0d0a16;border:1px solid #594275;
 color:white;font-size:16px;outline:none
}
input:focus{border-color:#b16cff}
button{
 width:100%;padding:15px;margin-top:20px;
 border:0;border-radius:11px;
 background:linear-gradient(90deg,#9139ef,#6025b7);
 color:white;font-weight:bold;font-size:16px;cursor:pointer
}
.back{
 background:#292039;border:1px solid #594275;
 margin-top:10px
}
.hidden{display:none}
.message{
 font-size:13px;text-align:center;margin-top:15px;
 color:#ffd37c;line-height:1.5
}
.note{
 font-size:12px;color:#a99bbd;text-align:center;
 line-height:1.7;margin-top:20px
}
a{color:#c99aff;text-decoration:none}
.footer{text-align:center;color:#766b87;font-size:11px;margin-top:25px}
</style>
</head>
<body>

<div class="container">
 <div class="logo">ST</div>
 <h1>Satya Toolkit 2.0</h1>
 <div class="sub">Independent StarMaker Toolkit</div>
 <div class="line"></div>

 <!-- FIRST SCREEN: NAME LOGIN -->
 <section id="nameScreen">
  <h3>Welcome User</h3>
  <p class="sub">पहले अपना नाम दर्ज करें</p>

  <form id="nameForm">
   <label for="username">Your Name</label>
   <input id="username" type="text"
    placeholder="Enter your name" maxlength="40" required>
   <button type="submit">Continue</button>
  </form>
 </section>

 <!-- SECOND SCREEN: ACTIVATION KEY -->
 <section id="keyScreen" class="hidden">
  <h3>Welcome, <span id="displayName"></span>!</h3>
  <p class="sub">अब अपनी Activation Key दर्ज करें</p>

  <form id="keyForm">
   <label for="activationKey">Activation Key</label>
   <input id="activationKey" type="text"
    placeholder="Enter activation key" required>

   <button type="submit">Activate Account</button>
  </form>

  <button class="back" id="backButton" type="button">
   Change Name
  </button>
 </section>

 <div id="message" class="message"></div>

 <div class="note">
  Don't have an activation key?<br>
  Contact Admin:
  <a href="https://t.me/Sunilpatil1900" target="_blank">
   @Sunilpatil1900
  </a>
 </div>

 <div class="footer">
  SATYA TOOLKIT 2.0 · Independent Project
 </div>
</div>

<script>
const nameScreen=document.getElementById("nameScreen");
const keyScreen=document.getElementById("keyScreen");
const message=document.getElementById("message");
const username=document.getElementById("username");
const displayName=document.getElementById("displayName");

document.getElementById("nameForm").addEventListener("submit",function(e){
 e.preventDefault();

 const name=username.value.trim();

 if(!name){
  message.textContent="Please enter your name.";
  return;
 }

 sessionStorage.setItem("satyaUserName",name);
 displayName.textContent=name;

 nameScreen.classList.add("hidden");
 keyScreen.classList.remove("hidden");
 message.textContent="";
});

document.getElementById("backButton").addEventListener("click",function(){
 keyScreen.classList.add("hidden");
 nameScreen.classList.remove("hidden");
 message.textContent="";
});

document.getElementById("keyForm").addEventListener("submit",function(e){
 e.preventDefault();

 const key=document.getElementById("activationKey").value.trim();

 if(!key){
  message.textContent="Please enter your activation key.";
  return;
 }

 message.textContent=
 "Activation server is not connected yet. Please try again later.";
});

</script>
</body>
</html>
